<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <!-- Outer ring: ethereal orbit -->
  <circle cx="32" cy="32" r="28" stroke="url(#g1)" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="32" cy="32" r="22" stroke="url(#g2)" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Central node: represents the nexus -->
  <circle cx="32" cy="32" r="10" fill="url(#g1)"/>
  <!-- Orbiting nodes: code, agent, cloud -->
  <circle cx="32" cy="8" r="4" fill="#6C5CE7" opacity="0.9"/>
  <circle cx="52" cy="42" r="4" fill="#a29bfe" opacity="0.9"/>
  <circle cx="12" cy="42" r="4" fill="#6C5CE7" opacity="0.7"/>
  <!-- Connection lines -->
  <line x1="32" y1="12" x2="32" y2="22" stroke="#6C5CE7" stroke-width="1.5" opacity="0.5"/>
  <line x1="48.5" y1="40" x2="40" y2="36" stroke="#a29bfe" stroke-width="1.5" opacity="0.5"/>
  <line x1="15.5" y1="40" x2="24" y2="36" stroke="#6C5CE7" stroke-width="1.5" opacity="0.5"/>
  <!-- Inner symbol: delta/code -->
  <path d="M29 28 L35 32 L29 36Z" fill="white" opacity="0.9"/>
</svg>
